name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ─── Deploy Flask API to App Service ──────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt -t api/.python_packages
      - name: Deploy to App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: cafe-dist-production-api
          publish-profile: ${{ secrets.AZURE_PROD_PUBLISH_PROFILE }}
          package: api/

      # ─── Run Database Schema ─────────────────────────────
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema to production database
        env:
          DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
        run: psql "$DATABASE_URL" -f infrastructure/schema.sql

      # ─── Deploy Static Web App ──────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Web App
        run: cd web && npm ci && npm run build
        env:
          VITE_API_BASE_URL: https://cafe-dist-production-api.azurewebsites.net/api
      - name: Deploy Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_PROD_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "web"
          output_location: "dist"

      # ─── Health Check ─────────────────────────────────────
      - name: Verify API health
        run: |
          sleep 30
          curl -sf https://cafe-dist-production-api.azurewebsites.net/api/health || echo "Health check failed"
